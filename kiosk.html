<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รับบัตรคิว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F7F6;
    --panel:#FFFFFF;
    --teal:#0B6E6E;
    --teal-dark:#084F4F;
    --amber:#F2A93B;
    --text:#14302D;
    --muted:#5B7873;
    --border:#DCE7E4;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--panel);
    border-radius:24px;
    padding:48px 40px;
    width:100%; max-width:460px;
    text-align:center;
    box-shadow:0 20px 50px rgba(11,110,110,0.08);
    border:1px solid var(--border);
  }
  h1{ font-size:22px; margin:0 0 4px; }
  p.sub{ color:var(--muted); margin:0 0 32px; font-size:15px; }

  .ticket{
    display:none;
    margin-bottom:28px;
  }
  .ticket.show{ display:block; animation:pop .35s ease; }
  @keyframes pop{ from{ transform:scale(.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .ticket .lbl{ color:var(--muted); font-size:14px; margin-bottom:8px; }
  .ticket .num{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700; font-size:72px;
    color:var(--teal-dark);
    letter-spacing:2px;
  }
  .ticket .wait{
    margin-top:10px; font-size:14px; color:var(--muted);
  }

  button{
    width:100%;
    padding:20px;
    border:none;
    border-radius:16px;
    background:var(--teal);
    color:#fff;
    font-family:'IBM Plex Sans Thai', sans-serif;
    font-weight:600;
    font-size:20px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--teal-dark); }
  button:active{ transform:scale(.98); }
  button:focus-visible{ outline:3px solid var(--amber); outline-offset:3px; }
  button:disabled{ background:#A9C4C0; cursor:not-allowed; }

  .error{
    display:none;
    margin-top:16px; padding:12px 16px;
    background:#FDECEC; color:#8A2A2A; border-radius:10px; font-size:14px;
  }
  .error.show{ display:block; }
</style>
</head>
<body>

<div class="card">
  <h1>ยินดีต้อนรับ</h1>
  <p class="sub">กดปุ่มด้านล่างเพื่อรับบัตรคิว</p>

  <div class="ticket" id="ticket">
    <div class="lbl">หมายเลขคิวของคุณ</div>
    <div class="num" id="ticketNum">A000</div>
    <div class="wait" id="ticketWait"></div>
  </div>

  <button id="takeBtn">กดรับบัตรคิว</button>
  <div class="error" id="errorBox"></div>
</div>

<script>
  // Local API served by server/index.js
  const API_URL = "/api";
  // เปลี่ยน prefix ได้ตามแผนก เช่น "A" (ทั่วไป), "B" (ฉีดยา) ฯลฯ
  const PREFIX = "A";

  const btn = document.getElementById('takeBtn');
  const ticket = document.getElementById('ticket');
  const errorBox = document.getElementById('errorBox');

  btn.addEventListener('click', async () => {
    if (API_URL.includes('PASTE_YOUR')){
      showError('ยังไม่ได้ตั้งค่า API_URL ในไฟล์นี้');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'กำลังออกบัตรคิว...';
    errorBox.classList.remove('show');
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json;charset=utf-8' },
        body: JSON.stringify({ action: 'createTicket', payload: { category: 'general', prefix: PREFIX } })
      });
      const body = await res.json();
      const issuedTicket = body?.data?.ticket;
      if (!res.ok || !body?.ok || !issuedTicket){ showError(body?.error || 'ออกบัตรคิวไม่สำเร็จ'); }
      else {
        document.getElementById('ticketNum').textContent = issuedTicket.ticketCode;
        document.getElementById('ticketWait').textContent = 'ออกบัตรคิวเรียบร้อย กรุณารับเอกสาร';
        ticket.classList.add('show');
        setTimeout(() => { ticket.classList.remove('show'); }, 15000);
      }
    }catch(err){
      showError('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่');
    }finally{
      btn.disabled = false;
      btn.textContent = 'กดรับบัตรคิว';
    }
  });

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
</script>
</body>
</html>
